<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Smart Timetable</title>
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">
        <i class="ri-lock-2-line"></i>
      </div>
      <h2>Reset Your Password</h2>
      <p>Enter your email and we'll send you a reset link.</p>
    </div>

    <!-- Status Alert -->
    <div id="forgot-status" class="alert alert-success" style="display: none; margin-bottom: 1rem;">
      <i class="ri-checkbox-circle-fill"></i>
      <span id="status-message">If an account exists, a reset link has been sent.</span>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Email Address <span class="req">*</span></label>
        <div style="position: relative;">
          <input type="email" id="forgot-email" class="form-control" placeholder="you@institution.edu" required style="padding-left: 2.3rem;">
          <i class="ri-mail-line" style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block">
          <i class="ri-send-plane-line"></i> Send Reset Link
        </button>
      </div>
    </form>

    <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem;">
      <a href="login.html" class="forgotpass" style="margin-top: 0;">
        <i class="ri-arrow-left-line"></i> Back to Login
      </a>
      <a href="index.html" class="forgotpass" style="color: var(--primary); font-weight: 600;">
        <i class="ri-home-4-line"></i> Back to Home
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const statusDiv = document.getElementById('forgot-status');
      const statusMsg = document.getElementById('status-message');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();

        if (!email) {
          statusMsg.textContent = 'Please enter a valid email address.';
          statusDiv.className = 'alert alert-danger';
          statusDiv.style.display = 'flex';
          return;
        }

        statusMsg.textContent = 'If an account with that email exists, a password reset link has been sent.';
        statusDiv.className = 'alert alert-success';
        statusDiv.style.display = 'flex';
        form.reset();
      });
    });
  </script>

</body>
</html>
