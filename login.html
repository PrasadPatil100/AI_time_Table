<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Smart Timetable Management System</title>
  <!-- Remix Icons for icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">
        <i class="ri-calendar-event-line"></i>
      </div>
      <h2>Faculty Login</h2>
      <p>Sign in to your Smart Timetable faculty account</p>
    </div>

    <!-- Error Alert Banner -->
    <div id="login-error" class="alert alert-danger" style="display: none;">
      <i class="ri-error-warning-line"></i>
      <span id="error-message">Invalid Username or Password!</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username <span class="req">*</span></label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-control" placeholder="Enter username" required style="padding-left: 2.3rem;">
          <i class="ri-user-line" style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="req">*</span></label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="Enter password" required style="padding-left: 2.3rem;">
          <i class="ri-lock-line" style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block">
          <i class="ri-login-box-line"></i> Login as Faculty
        </button>
        <a href="forgotpass.html" class="forgot-password">
          Forgot Password
        </a>
        <a href="index.html" class="forgotpass" style="margin-top: 0.5rem;">
          <i class="ri-arrow-left-line"></i> Back to Home
        </a>
        <a href="register.html" class="forgotpass" style="margin-top: 0.75rem; color: var(--primary); font-weight: 600;">
          Don't have an account? <strong>Register</strong>
        </a>
      </div>

    </form>

    <!-- <div style="margin-top: 1.75rem; text-align: center; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted);">
      <p>Demo Credentials: <strong>faculty</strong> / <strong>faculty123</strong></p>
    </div>
  </div> -->

  <script src="script.js"></script>
  <script>
    // Login form specific logic
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('error-message');

      // If already logged in, redirect straight to landing page
      if (localStorage.getItem('timetable_logged_in') === 'true') {
        window.location.href = 'index.html';
      }

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();

        // Check registered faculty account first, then demo account
        let authenticated = false;
        const savedReg = localStorage.getItem('timetable_registration');
        if (savedReg) {
          try {
            const reg = JSON.parse(savedReg);
            const idMatch = (u === reg.email || u === reg.name);
            if (idMatch && p === reg.password) {
              authenticated = true;
            }
          } catch (err) { /* ignore malformed data */ }
        }

        // Demo fallback
        if (!authenticated && u === 'faculty' && p === 'faculty123') {
          authenticated = true;
        }

        if (authenticated) {
          localStorage.setItem('timetable_logged_in', 'true');
          localStorage.setItem('timetable_role', 'faculty');
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = 'Invalid credentials! Use your registered email/name & password, or demo: faculty / faculty123';
          errorDiv.style.display = 'flex';
        }
      });
    });
  </script>
</body>
</html>
